name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The launcher uses Lumora.Contracts from lumora-auth, checked out side by side
      # exactly like the local layout (Minecraft/lumora-auth + Minecraft/lumora-launcher).
      - uses: actions/checkout@v4
        with:
          path: lumora-launcher
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/lumora-auth
          path: lumora-auth
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
        working-directory: lumora-launcher
      - run: dotnet test --no-build -c Release
        working-directory: lumora-launcher
